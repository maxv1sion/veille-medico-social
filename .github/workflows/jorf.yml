name: Récupération du Journal officiel

on:
  schedule:
    - cron: "10 4 * * *"   # chaque jour vers 6h10 (heure d'été) / 5h10 (heure d'hiver), avant la veille Claude de 7h50
  workflow_dispatch: {}     # bouton « Run workflow » pour lancer à la main
  push:
    branches: [main]
    paths: ["scripts/jorf.py"]   # relance automatique quand les règles de tri changent

permissions:
  contents: write

concurrency:
  group: jorf
  cancel-in-progress: false

jobs:
  jorf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger et filtrer le JO (données ouvertes DILA)
        run: python3 scripts/jorf.py

      - name: Enregistrer les candidats dans le dépôt
        run: |
          git config user.name "Veille JO (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jorf/ telechargements/
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "JO du $(date +%F) : candidats de veille"
            git pull --rebase origin main
            git push origin main
          fi
